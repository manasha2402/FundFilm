<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pledge Admin Panel</title>
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>Pledge Admin Page</h1>
    <form action="/api/delete" method ="post">
        <div class="mb-3">
            <label class="form-label" for="email">Email of Pledge to Delete</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary" type="submit">DELETE PLEDGE</button>
        </div>
    </form>

    <form action="/api/updatePledge" method ="post">
        <div class="mb-3">
            <label class="form-label" for="email">Email of Pledge to Update</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="pledge">New Pledge Amount</label>
            <input type="number" class="form-control" name="pledge" required>
        </div>
        <div class="mb-3">
            <button class="btn btn-primary" type="submit">UPDATE PLEDGE</button>
        </div>
    </form>
    </div>

    <script src = "../frontend/js/frontend-margaret.js" type="module"></script>
    <!--Bootstrap link-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
